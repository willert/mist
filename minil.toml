name = "App-Mist"

no_github_issues = true

# Set explicitly rather than inheriting Minilla's default of ModuleBuildTiny.
# MBT has to be vendored into mpan-dist along with ExtUtils::{Helpers,Config,
# InstallPaths} - four tarballs committed to the mirror for a build toolchain -
# where a mist project already carries ExtUtils::MakeMaker. EUMM also installs
# bin/ and sbin/, which MBT refuses, so it is the right default for mist-managed
# projects generally, not just this one.
module_maker = "ExtUtilsMakeMaker"

# EUMM's EXE_FILES shape: globs for absent dirs simply match nothing.
script_files = ['bin/*', 'sbin/*', 'script/*']

[release]
do_not_upload_to_cpan = true

# Replaces Minilla's default no_index list, so the defaults must be repeated
# here verbatim. The two lib/ entries keep the bundled Minilla overrides out
# of both the version bump and the mpan-dist index -- they are Minilla-namespace
# plugins, not App-Mist's own API surface.
[no_index]
directory = ['t', 'xt', 'inc', 'share', 'eg', 'examples', 'author', 'builder', 'lib/Minilla', 'lib/Mist/Minilla']
